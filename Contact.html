<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Snenhlanhla</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="logo.jpeg" alt="Logo">
            </div>

            <div class="menu-icon" id="menu-icon">&#9776;</div>

            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="contact.html" class="active-link">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-content">
            <h1>Contact Me</h1>
            <p>If you would like to work together, have any questions, or just want to connect, feel free to reach out!</p>

            <form class="contact-form" id="contact-form" action="#" method="POST">
                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Your Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Connect with me:</p>
        <a href="https://www.facebook.com/paciencia.precious/">Facebook</a> | 
        <a href="https://x.com/Snenhla79084643">Twitter</a> | 
        <a href="https://www.linkedin.com/in/snenhlanhla-mkhwanazi-6b55561a9/">LinkedIn</a>
        <p>Phone: 0659987903</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
